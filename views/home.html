<!DOCTYPE html>
<html>
<head>

<title>Dashboard</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">

</head>

<body>

<div class="sidebar">

<h4>University Portal</h4>

<a href="#">Dashboard</a>
<a href="#">Courses</a>
<a href="#">My Courses</a>
<a href="#">Schedule</a>
<a href="#">Grades</a>
<a href="/logout">Logout</a>

</div>

<div class="content">

<h3>Welcome back!</h3>

<div class="stats">

<div class="stat-card">
<h5>Registered Courses</h5>
<p id="registeredCount">0</p>
</div>

<div class="stat-card">
<h5>Total Credits</h5>
<p id="totalCredits">0</p>
</div>

<div class="stat-card">
<h5>Enrollment Progress</h5>
<p id="progress">0%</p>
</div>

<div class="stat-card">
<h5>Upcoming Classes</h5>
<p id="upcomingClasses">0</p>
</div>

</div>

<h4>Available Courses</h4>

<table class="table table-bordered">

<thead class="table-dark">
<tr>
<th>Code</th>
<th>Title</th>
<th>Instructor</th>
<th>Schedule</th>
<th>Credits</th>
<th>Seats Available</th>
<th>Register</th>
</tr>
</thead>

<tbody id="courses"></tbody>

</table>

</div>


<script>

async function loadCourses(){

const res = await fetch("/api/courses");
const courses = await res.json();

let html = "";

courses.forEach(course => {

let seatsLeft = course.capacity - course.enrolled;

html += `
<tr>

<td>${course.code}</td>
<td>${course.title}</td>
<td>${course.instructor}</td>
<td>${course.schedule}</td>
<td>${course.credits}</td>

<td>
${seatsLeft} / ${course.capacity}
</td>

<td>
<button class="btn btn-success btn-sm"
onclick="registerCourse('${course._id}')">
Register
</button>
</td>

</tr>
`;

});

document.getElementById("courses").innerHTML = html;

}



async function registerCourse(id){

const res = await fetch("/api/courses/register",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({courseId:id})

});

const data = await res.json();

alert(data.message || data.error);

loadCourses();
loadDashboard();

}



async function loadDashboard(){

const res = await fetch("/api/user/courses");
const courses = await res.json();

document.getElementById("registeredCount").innerText = courses.length;

let credits = 0;

courses.forEach(c=>{
credits += c.credits;
});

document.getElementById("totalCredits").innerText = credits;

let progress = Math.round((courses.length / 5) * 100);

document.getElementById("progress").innerText = progress + "%";

document.getElementById("upcomingClasses").innerText = courses.length;

}


loadCourses();
loadDashboard();

</script>

</body>
</html>
